<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Weekly Budget</title>
<meta name="theme-color" content="#EDF1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1510" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Each bottom section has its own tint: Spending green, Net Worth blue, Goals orange.
   The tint tokens are registered colors so switching sections fades between them. */
@property --bg{syntax:"<color>";inherits:true;initial-value:#EDF1EA}
@property --surface{syntax:"<color>";inherits:true;initial-value:#FFFFFF}
@property --ink{syntax:"<color>";inherits:true;initial-value:#17251D}
@property --muted{syntax:"<color>";inherits:true;initial-value:#617066}
@property --line{syntax:"<color>";inherits:true;initial-value:#D3DCD1}
@property --track{syntax:"<color>";inherits:true;initial-value:#DEE6DB}
@property --hero{syntax:"<color>";inherits:true;initial-value:#1E4A37}
@property --hero-ink{syntax:"<color>";inherits:true;initial-value:#EAF3EC}
@property --hero-muted{syntax:"<color>";inherits:true;initial-value:#A9C4B3}
@property --hero-bar{syntax:"<color>";inherits:true;initial-value:#8FC7A6}
@property --glow1{syntax:"<color>";inherits:true;initial-value:rgba(150,196,165,.55)}
@property --glow2{syntax:"<color>";inherits:true;initial-value:rgba(150,196,165,.18)}
@property --base1{syntax:"<color>";inherits:true;initial-value:#EDF1EA}
@property --base2{syntax:"<color>";inherits:true;initial-value:#EDF1EA}
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --ink:#17251D; --muted:#617066; --line:#D3DCD1; --track:#DEE6DB;
  --hero:#1E4A37; --hero-ink:#EAF3EC; --hero-muted:#A9C4B3; --hero-bar:#8FC7A6;
  --glow1:rgba(150,196,165,.55); --glow2:rgba(150,196,165,.18); --base1:#EDF1EA; --base2:#EDF1EA;
  --ok:#2D7A50; --billbar:#2A3A31; --need:#2D6A4C; --want:#B8741A; --over:#B0392A; --bill:#5E7C8A;
  --plot:var(--hero);   /* chart line: the section tint */
  --pie1:#104281; --pie2:#256abf; --pie3:#5598e7; --pie4:#86b6ef;   /* home, car, investments, bank */
  --gbar:#FF7A00;   /* goal progress */
  --font:"Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-tint="networth"]{
  --bg:#EAF0F7; --surface:#FFFFFF; --ink:#17222E; --muted:#606D7B; --line:#CFDAE6; --track:#DAE5F0;
  --hero:#224263; --hero-ink:#E9F1FA; --hero-muted:#A8BFD8; --hero-bar:#8EBDED;
  --glow1:rgba(147,187,230,.55); --glow2:rgba(147,187,230,.18); --base1:#EAF0F7; --base2:#EAF0F7;
}
:root[data-tint="goals"]{
  --bg:#F6EEE7; --surface:#FFFFFF; --ink:#2C1E12; --muted:#79685A; --line:#E4D6CA; --track:#EEE0D5;
  --hero:#8B441A; --hero-ink:#F9EEE5; --hero-muted:#EBCEB7; --hero-bar:#EEA573;
  --glow1:rgba(231,167,124,.55); --glow2:rgba(231,167,124,.18); --base1:#F6EEE7; --base2:#F6EEE7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#18211C; --ink:#E2EBE4; --muted:#8E9E94; --line:#29352E; --track:#233029;
    --hero:#163A2B; --hero-ink:#E6F2EA; --hero-muted:#93B3A0; --hero-bar:#6FB690;
    --glow1:rgba(46,104,76,.85); --glow2:rgba(24,60,43,.45); --base1:#0B1510; --base2:#070D0A;
    --ok:#5CC08B; --billbar:#F2F6F3; --need:#62B38C; --want:#E3A24B; --over:#E6705D; --bill:#7FA3B3;
    --plot:var(--hero-bar); --gbar:#FF9233; --pie1:#b7d3f6; --pie2:#6da7ec; --pie3:#2a78d6; --pie4:#184f95;
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-tint="networth"]{
    --bg:#0F151B; --surface:#181F27; --ink:#E1E9F2; --muted:#8D9BAA; --line:#29333D; --track:#232E39;
    --hero:#19344E; --hero-ink:#E5F0FB; --hero-muted:#92ADCA; --hero-bar:#70A9E4;
    --glow1:rgba(49,94,138,.85); --glow2:rgba(26,54,81,.45); --base1:#0B131B; --base2:#070C11;
  }
  :root:not([data-theme="light"])[data-tint="goals"]{
    --bg:#1A120C; --surface:#261D15; --ink:#F1E6DD; --muted:#A79687; --line:#3B2F24; --track:#372A1F;
    --hero:#632F11; --hero-ink:#F9ECE1; --hero-muted:#C4A387; --hero-bar:#E38C4C;
    --glow1:rgba(137,71,10,.85); --glow2:rgba(80,39,5,.45); --base1:#1A1008; --base2:#100A06;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18211C; --ink:#E2EBE4; --muted:#8E9E94; --line:#29352E; --track:#233029;
  --hero:#163A2B; --hero-ink:#E6F2EA; --hero-muted:#93B3A0; --hero-bar:#6FB690;
  --glow1:rgba(46,104,76,.85); --glow2:rgba(24,60,43,.45); --base1:#0B1510; --base2:#070D0A;
  --ok:#5CC08B; --billbar:#F2F6F3; --need:#62B38C; --want:#E3A24B; --over:#E6705D; --bill:#7FA3B3;
  --plot:var(--hero-bar); --gbar:#FF9233; --pie1:#b7d3f6; --pie2:#6da7ec; --pie3:#2a78d6; --pie4:#184f95;
  color-scheme:dark;
}
:root[data-theme="dark"][data-tint="networth"]{
  --bg:#0F151B; --surface:#181F27; --ink:#E1E9F2; --muted:#8D9BAA; --line:#29333D; --track:#232E39;
  --hero:#19344E; --hero-ink:#E5F0FB; --hero-muted:#92ADCA; --hero-bar:#70A9E4;
  --glow1:rgba(49,94,138,.85); --glow2:rgba(26,54,81,.45); --base1:#0B131B; --base2:#070C11;
}
:root[data-theme="dark"][data-tint="goals"]{
  --bg:#1A120C; --surface:#261D15; --ink:#F1E6DD; --muted:#A79687; --line:#3B2F24; --track:#372A1F;
  --hero:#632F11; --hero-ink:#F9ECE1; --hero-muted:#C4A387; --hero-bar:#E38C4C;
  --glow1:rgba(137,71,10,.85); --glow2:rgba(80,39,5,.45); --base1:#1A1008; --base2:#100A06;
}
/* the fade only runs once you switch sections, never on first load */
:root.fx{transition:--bg .7s ease, --surface .7s ease, --ink .7s ease, --muted .7s ease, --line .7s ease, --track .7s ease, --hero .7s ease, --hero-ink .7s ease, --hero-muted .7s ease, --hero-bar .7s ease, --glow1 .7s ease, --glow2 .7s ease, --base1 .7s ease, --base2 .7s ease}
*,*::before,*::after{box-sizing:border-box}
/* Fixed gradient layer (works on iPhone, where background-attachment:fixed doesn't) */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(75% 42% at 0% 0%,var(--glow1) 0%,var(--glow2) 44%,transparent 75%),linear-gradient(180deg,var(--base1) 0%,var(--base2) 100%);pointer-events:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
input,textarea{caret-color:transparent}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--want);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:12px 18px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.top.head{padding:6px 0 6px}
.top.period{padding:0 0 12px}
/* Week / Month / Year switch at the top of Spending */
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--surface);border-radius:999px;flex:0 1 auto;min-width:0}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:380px){.seg button{padding:7px 11px;font-size:.88rem}}
.ptitle{font-weight:800;font-size:1.6rem;letter-spacing:-.025em;padding-left:2px}
.soon{border:1.5px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;margin-top:6px}
.soon .empty{padding:0}
.nav{display:flex;align-items:center;gap:4px}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon:hover{background:var(--track)}
.icon svg{width:20px;height:20px}
.title{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;width:7.4rem;text-align:center;white-space:nowrap}
.title.wide{width:8.8rem}
.jump{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.banner{font-size:.85rem;color:var(--muted);background:var(--track);border-radius:10px;padding:8px 12px;margin-bottom:12px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:22px 20px 16px;margin-bottom:26px;border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hero .lbl{color:var(--hero-muted);font-size:.9rem}
.hero .big{font-weight:800;font-size:clamp(2.6rem,11vw,3.6rem);letter-spacing:-.035em;line-height:1;margin:4px 0 18px}
.hero .big .c{font-size:.5em;letter-spacing:0;font-weight:700;vertical-align:.62em;margin-right:2px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.day{border:0;background:transparent;color:inherit;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.day .col{width:100%;height:92px;display:flex;align-items:flex-end;justify-content:center;border-radius:8px;background:rgba(255,255,255,.06)}
.day .bar{width:100%;border-radius:8px;background:var(--hero-bar);min-height:3px;transition:height .35s ease}
.day .amt{font-size:.72rem;color:var(--hero-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day .dn{font-size:.8rem;font-weight:600;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.day.today .dn{background:var(--hero-ink);color:var(--hero)}
.day.today .bar{background:var(--want)}
.day.sel .col{outline:2px solid var(--hero-ink);outline-offset:2px}
.day.dim .bar{opacity:.4}
.dayx{display:grid;grid-template-rows:1fr;margin-top:16px}
.dayx.grow{animation:dayOpen .28s ease-out}
@keyframes dayOpen{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
.dayx>.in{overflow:hidden;min-height:0;border-top:1px solid rgba(255,255,255,.16);padding-top:6px}
.dayx .dxh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 4px}
.dayx .dxh b{font-size:1rem}
.dayx .dxh .r{display:flex;align-items:center;gap:4px;color:var(--hero-muted);font-size:.9rem}
.dayx .icon{color:var(--hero-ink);width:34px;height:34px}
.dayx .icon:hover{background:rgba(255,255,255,.1)}
.hero .tx{border-bottom-color:rgba(255,255,255,.12);color:var(--hero-ink)}
.hero .tx:last-child{border-bottom:0}
.hero .tx .ct{color:var(--hero-muted)}
.hero .tx .a.neg{color:var(--hero-bar)}
.hero .empty{color:var(--hero-muted)}
.addday{border:1px dashed rgba(255,255,255,.3);background:transparent;color:var(--hero-ink);border-radius:12px;padding:10px;width:100%;font-weight:600;margin-top:10px}
.addday:hover{background:rgba(255,255,255,.06)}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:16px 18px;text-align:left}
.ph .pt{display:flex;flex-direction:column}
.ph .pt b{font-size:1.1rem;letter-spacing:-.015em}
.ph .pt span{font-size:.85rem;color:var(--muted)}
.ph .pr{display:flex;align-items:center;gap:10px;white-space:nowrap}
.ph .pr b{font-size:1.1rem}
.ph .pr .of{font-size:.85rem;font-weight:500;color:var(--muted)}
.pbox .pin>.grp,.pbox .pin>.gblk>.grp{margin:12px -8px;padding:2px 12px 0}
.pbox .pin>.gblk{margin:0}
.pbox .pin .grp .tx{gap:10px}
.pbox .pin .grp .tx .a{min-width:0}
.pbox .pin>.tx:last-child{border-bottom:0}
.ph:hover .pt b{text-decoration:underline;text-underline-offset:3px}
.pbox.open{border-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.bbtn{display:block;width:100%;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.bbtn:hover .l>span:first-child{text-decoration:underline;text-underline-offset:3px}
.cx.open{padding-bottom:4px}
.catx{margin:10px 0 2px;padding-left:12px;border-left:3px solid var(--line)}
.catx .tx{padding:8px 0}
.catx .tx:last-child{border-bottom:0}
.wkx{border-bottom:1px solid var(--line)}
.wkx:last-child{border-bottom:0}
.wkh{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:12px 0;font-weight:600;text-align:left}
.wkh .r{color:var(--muted);font-weight:500}
.wkh:hover span:first-child{text-decoration:underline;text-underline-offset:3px}
.wkx.open .wkh{border-bottom:1px solid var(--line)}
.wkx .tx:last-child{border-bottom:0}
.pbox .brow:last-child{border-bottom:0}
.pbox .pin{border-top:1px solid var(--line);padding:0 18px 8px}
/* each day in "Purchases this week" sits in its own rounded card */
.pbox .daygrp{border:1px solid var(--line);border-radius:14px;padding:2px 12px 0;margin:12px -8px}
.pbox .daygrp .tx{gap:10px}
.pbox .daygrp .tx .a{min-width:0}
.pbox .daygrp:last-child{margin-bottom:10px}
.pbox .daygrp .dh{padding:10px 0 2px}
.pbox .daygrp .tx:last-child{border-bottom:0}
.pbox .daygrp .tx{border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}

/* sections */
section{margin-bottom:30px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sh h2{font-size:1.2rem;font-weight:700;letter-spacing:-.015em;margin:0}
.sh .aside{color:var(--muted);font-size:.9rem;text-align:right}
.overtxt{color:var(--over);font-weight:600}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fig{background:var(--surface);padding:14px 14px 12px}
.fig .k{font-size:.82rem;color:var(--muted)}
.fig .v{font-weight:700;font-size:1.15rem;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.fig.tot .v{font-weight:800}
.note{font-size:.85rem;color:var(--muted);margin-top:8px}

.grp{margin-bottom:12px;border:1px solid var(--line);border-radius:14px;padding:2px 14px 0}
.gblk{margin-bottom:18px}
.gblk>.gh{border-bottom:0;padding:0 2px 8px;margin:0}
.gblk>.grp{margin-bottom:0}
.grp>.brow:last-child,.grp>.cx:last-child,.grp>.tx:last-child{border-bottom:0}
.grp>.dh{padding:10px 0 2px}
.gh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.gh .n{font-weight:700;display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.gh .t{font-size:.9rem;color:var(--muted)}
.gh .gwk{font-size:.78rem;font-weight:500;color:var(--muted);margin-left:2px}
.gh .t b{color:var(--ink)}
.brow{padding:10px 0;border-bottom:1px solid var(--line)}
.brow .l{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.brow .l span:last-child{color:var(--muted);white-space:nowrap}
.brow .l b{color:var(--ink);font-weight:600}
.track{height:8px;background:var(--track);border-radius:4px;margin-top:7px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.brow .l span.amt{font-weight:700;white-space:nowrap}
.brow .l span.amt.ok{color:var(--ok)}
.brow .l span.amt.bad{color:var(--over)}
.brow .l span.amt.neu{color:var(--ink)}
.over .fill{background:var(--over)!important}
.fill{position:relative;display:block}
.wseg{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px);border-radius:0 4px 4px 0}
.brow .l{flex-wrap:wrap;row-gap:2px}
.brow .l>span:last-child{margin-left:auto}
.brow .l .wk,.brow.over .l span.wk{font-size:.78rem;color:var(--muted);margin-left:8px;white-space:nowrap}

.daygrp{margin-bottom:6px}
.dh{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding:12px 0 4px;font-weight:600}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:hover .nt{text-decoration:underline;text-underline-offset:3px}
.tx .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .nm small{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx.ign .nt,.tx.ign .a{text-decoration:line-through;opacity:.5}
.tx .ct{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.tx .a{font-weight:600;white-space:nowrap;min-width:78px;text-align:right}
.tx .a.neg{color:var(--need)}
.hold{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1;padding:3px 6px 2px;border-radius:999px;border:1px solid currentColor;color:var(--want);margin-right:6px;vertical-align:1px}
.tx.held .a{color:var(--muted)}
.hero .heldnote{margin:-4px 0 14px;font-size:.82rem}
.note .hold{margin-right:4px}
.empty{color:var(--muted);padding:14px 0;font-size:.95rem}

.wbars{display:flex;flex-direction:column;gap:8px}
.wpills{display:flex;flex-direction:column;gap:10px}
.wpill{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 22px;border-radius:999px;border:0;background:var(--glow);text-align:left;font-size:.98rem;isolation:isolate}
/* the two-color outline, drawn as a ring so the inside stays see-through */
.wpill::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2.5px;background:var(--ring);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.wpill .wl{font-weight:600}
.wpill .wr{font-weight:700}
.wpill:hover .wl{text-decoration:underline;text-underline-offset:3px}
.wb{display:grid;grid-template-columns:92px 1fr 84px;gap:10px;align-items:center;font-size:.9rem;border:0;background:transparent;padding:4px 0;text-align:left;width:100%}
.wb .r{text-align:right;font-weight:600}
.wb .track{margin:0;height:12px}
.wb .fill{background:var(--need)}
.wb:hover .l{text-decoration:underline;text-underline-offset:3px}

.ychart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-top:8px}
.yfw{position:relative}
.yfb{width:36px;height:36px;margin:-6px 0;color:var(--muted)}
.yfb.on{color:var(--ink);background:var(--track)}
.yfm{position:absolute;right:0;top:calc(100% + 6px);z-index:8;width:max-content;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.28);animation:dayOpen .18s ease-out}
.yfm button{display:flex;align-items:center;gap:10px;width:100%;white-space:nowrap;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;font-size:.92rem;color:var(--ink)}
.yfm button:hover{background:var(--track)}
.yfm button[aria-checked="true"]{background:var(--track);font-weight:700}
.yfm .sws{display:inline-flex;gap:2px}
.legend span{display:flex;align-items:center;gap:6px}
.mtable{width:100%;border-collapse:collapse;font-size:.92rem}
.mtable th{text-align:right;font-weight:500;color:var(--muted);font-size:.82rem;padding:6px 0 6px 8px;border-bottom:2px solid var(--ink)}
.mtable th:first-child,.mtable td:first-child{text-align:left;padding-left:0}
.mtable td{text-align:right;padding:9px 0 9px 8px;border-bottom:1px solid var(--line)}
.mtable tr.click{cursor:pointer}
.mtable tr.click:hover td:first-child{text-decoration:underline;text-underline-offset:3px}
.mtable td.b{font-weight:700}
.mtable tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}

details.wk{border-bottom:1px solid var(--line)}
details.wk summary{list-style:none;display:flex;justify-content:space-between;padding:12px 0;cursor:pointer;font-weight:600}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary .r{color:var(--muted);font-weight:500}
details.wk[open] summary{border-bottom:1px solid var(--line)}
details.wk .tx:last-child{border-bottom:0}

/* net worth: the big number, and its breakdown when opened */
.nwhero{padding:0;overflow:hidden}
.nwtap{display:block;width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:22px 20px 18px;border-radius:22px}
.nwtap .big{margin:4px 0 14px}
.nwtap .big.long{font-size:clamp(2.1rem,9vw,3rem)}
.nwsplit{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;color:var(--hero-muted);font-size:.92rem}
.nwsplit b{color:var(--hero-ink)}
.nwlbl{display:flex;justify-content:space-between;align-items:center;gap:12px}
.nwlbl .more{display:flex;align-items:center;gap:3px;font-weight:600;font-size:.88rem;color:var(--hero-ink)}
.nwlbl .more svg{width:18px;height:18px;transition:transform .25s ease}
.nwtap[aria-expanded="true"] .more svg{transform:rotate(180deg)}
.nwtap:hover .more{text-decoration:underline;text-underline-offset:3px}
.nwhero .dayx{margin:0;padding:0 20px 12px}
.nwg{padding-top:8px}
.nwgh{display:flex;justify-content:space-between;align-items:baseline;font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--hero-muted);padding:10px 0 7px;border-bottom:1px solid rgba(255,255,255,.22)}
.nwgh b{font-size:.98rem;letter-spacing:0;color:var(--hero-ink);text-transform:none}
.nwc{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.nwc:last-child{border-bottom:0}
.nwr,.nws{display:grid;grid-template-columns:minmax(0,1fr) auto 34px;align-items:center;gap:8px}
.nwhero:not(.editing) .nwr{grid-template-columns:minmax(0,1fr) auto}
.nwbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 2px;font-size:.8rem;color:var(--hero-muted)}
.nwmode{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--hero-ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.86rem}
.nwmode svg{width:14px;height:14px}
.nwmode.on{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}
.nwi{padding:4px 0 4px 12px}
.nwir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:.9rem}
.nwhero.editing .nwir{grid-template-columns:minmax(0,1fr) auto 34px}
.nwhero.editing .nwir::after{content:""}
.nwir .ni{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nwir .nv{font-weight:600;white-space:nowrap}
.nwa{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem;color:var(--hero-muted);min-height:20px}
.nwhero.editing .nwa{grid-template-columns:minmax(0,1fr) auto 30px;min-height:32px}
.nwa span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nwa i{font-style:normal;opacity:.8}
.nwi.off .nwir .nv,.nwi.off .nwa span:nth-child(2){text-decoration:line-through}
.nwi.off{opacity:.75}
.nwplus{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--hero-ink);font-weight:600;font-size:.84rem;padding:6px 0 4px 12px}
.nwplus .pc{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center}
.nwplus .pc svg{width:13px;height:13px}
.nwplus:hover .pc{background:rgba(255,255,255,.12)}
.nwr{min-height:34px}
.nwr .nl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nwr .nv{font-weight:700;white-space:nowrap}
.nws{font-size:.84rem;color:var(--hero-muted);padding:1px 0 3px 12px}
.nws span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nwpen{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--hero-muted);display:grid;place-items:center}
.nwpen:hover{background:rgba(255,255,255,.1);color:var(--hero-ink)}
.nwpen svg{width:16px;height:16px}
/* net worth setup: one question per screen */
.nwprog{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin:4px 0 16px}
.nwprog i{display:block;height:100%;background:var(--hero);border-radius:2px;transition:width .3s ease}
.qchips{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 4px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.qchip[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px 20px}
.qeye{font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.qcard h2{margin:6px 0 6px;font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.qhint{margin:0 0 16px;color:var(--muted);font-size:.92rem}
.qhint a{color:var(--ink);font-weight:600;text-underline-offset:3px}
.qflabel{display:block;font-size:.85rem;color:var(--muted)}
.qnone{margin-top:16px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 15px;font-size:.9rem;font-weight:600;color:var(--muted)}
.qnone:hover{border-color:var(--ink);color:var(--ink)}
.qor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin:18px 0 6px}
.qor::before,.qor::after{content:"";flex:1;height:1px;background:var(--line)}
.llist{margin-bottom:14px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow .ln{display:flex;flex-direction:column;min-width:0}
.lrow .ln small{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow>b{white-space:nowrap}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 112px 36px;gap:8px;align-items:center;margin-bottom:8px}
.orow .inp{padding:10px 12px}
.savelink{border:0;background:transparent;font-weight:700;color:var(--ink);padding:8px 6px;font-size:1rem}
.savelink:hover{text-decoration:underline;text-underline-offset:3px}
.nwintro .big{font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.08;margin:6px 0 12px;text-wrap:balance}
.nwintro p{color:var(--hero-muted);margin:0 0 18px}
.nwlists{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.nwlists b{display:block;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--hero-muted);margin-bottom:6px}
.nwlists ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-weight:600}
.btn.onhero{background:var(--hero-ink);color:var(--hero);width:100%}
@media (max-width:380px){.orow{grid-template-columns:minmax(0,1fr) 92px 32px}}
/* net worth pie: what you own */
.nwpie{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 16px 6px}
.pie-wrap{display:flex;justify-content:center;padding:8px 0 12px}
.pie{width:min(188px,58vw);height:auto;display:block;overflow:visible}
.pie [data-pie]{cursor:pointer;transition:opacity .15s ease}
.pie.has-sel [data-pie]:not(.on){opacity:.25}
.prow{display:grid;grid-template-columns:12px minmax(0,1fr) auto 42px;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:10px 2px;transition:opacity .15s ease}
.prow .psw{width:12px;height:12px;border-radius:4px}
.prow .pl{display:flex;flex-direction:column;min-width:0}
.prow .pl b{font-weight:600}
.prow .pl small{color:var(--muted);font-size:.8rem;line-height:1.3}
.prow .pv{font-weight:700;white-space:nowrap}
.prow .pp{color:var(--muted);text-align:right;font-size:.88rem}
.prows.has-sel .prow:not(.on){opacity:.4}
.prow:hover .pl b{text-decoration:underline;text-underline-offset:3px}
.pnote{margin:4px 0 10px}
/* paused linked accounts, reactivate, edit a linked account */
.nwpen.sm{width:30px;height:30px;justify-self:end}
.nwpen.sm svg{width:14px;height:14px}
.nws.off{opacity:.75}
.nws.off span:nth-child(2){text-decoration:line-through}
.nwph{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--hero-muted);padding:4px 0 2px 12px}
.nwre-row{padding:6px 0 4px 12px}
.nwre{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.32);background:transparent;color:var(--hero-ink);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600}
.nwre:hover{background:rgba(255,255,255,.1)}
.nwre svg{width:15px;height:15px}
.warnbox{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--want);background:color-mix(in srgb,var(--want) 12%,transparent);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:.88rem}
.warnbox b{font-size:.95rem}
.infobox{border:1px solid var(--line);background:var(--track);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:.88rem}
.acard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:2px 14px}
.acard>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.acard>div:last-child{border-bottom:0}
.acard span{color:var(--muted)}
.acard b{text-align:right}
.lrow .lact{width:34px;height:34px;flex:none;margin-left:-6px;color:var(--muted)}
.lrow .lact svg{width:15px;height:15px}
.btn.del.warn{color:var(--over)}
/* link buttons in setup */
.lbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.lbtn svg{width:18px;height:18px;flex:none}
.lnote{margin:8px 0 0;text-align:center;font-size:.82rem}
.linkalt{display:block;margin:10px auto 0;border:0;background:transparent;color:var(--ink);font-weight:600;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;padding:4px}
/* net worth over time */
.rng{display:flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--surface);border-radius:999px}
.rng button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:.82rem;font-weight:700;color:var(--muted)}
.rng button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.nwchart{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 16px 12px}
.nwch-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-height:46px}
.nwch-v{font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.nwch-d{font-size:.85rem;color:var(--muted);text-align:right}
.nwch-d b{font-weight:700}
.nwch-d .up{color:var(--ok)} .nwch-d .down{color:var(--over)}
.nwplot{position:relative;height:190px;margin:6px -4px 0;touch-action:pan-y;outline:none;border-radius:10px;cursor:crosshair}
.nwplot:focus-visible{outline:2px solid var(--want);outline-offset:2px}
.nwplot svg{display:block;width:100%;height:100%;overflow:visible}
.nwplot .gl{stroke:var(--line);stroke-width:1}
.nwplot .tk{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.nwplot .ln{fill:none;stroke:var(--plot);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.nwplot .ar{fill:url(#nwgrad)}
.nwplot .gs{stop-color:var(--plot)}
.nwplot .dot{fill:var(--plot);stroke:var(--surface);stroke-width:2}
.nwplot .xh{stroke:var(--muted);stroke-width:1}


/* goals */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gcard+.gcard{margin-top:12px}
.gtop{padding:16px 16px 14px}
.gname{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gname b{font-size:1.08rem;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtag{flex:none;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.gamts{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;font-size:.92rem;color:var(--muted)}
.gamts b{color:var(--ink);font-size:1.25rem;letter-spacing:-.02em}
.gbar{height:10px;border-radius:5px;background:var(--track);margin-top:8px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:5px;background:var(--gbar)}
.gmeta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:.86rem;color:var(--muted)}
.gmeta b{color:var(--ink);font-weight:700}
.gwarn{color:var(--over);font-weight:600}
.gfoot{display:flex;border-top:1px solid var(--line)}
.gfoot button{flex:1;border:0;background:transparent;padding:12px;font-weight:600;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:6px}
.gfoot button+button{border-left:1px solid var(--line)}
.gfoot svg{width:16px;height:16px}
.gfoot [aria-expanded="true"] svg{transform:rotate(180deg)}
.groad{border-top:1px solid var(--line);padding:4px 16px 10px}
.gmon{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 0 4px}
.grw{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.grw.two{grid-template-columns:minmax(0,1fr) 74px 88px 40px;gap:6px}
.gseg.sm{display:inline-flex;gap:2px;padding:2px;border-radius:999px;margin:0 0 4px}
.gseg.sm button{padding:3px 12px;font-size:.76rem;border-radius:999px}
.gseg button:disabled{opacity:.4}
.gitem{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.gitem-h{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 36px;gap:8px;align-items:center}
.gitem .inp{padding:10px 11px}
.gil{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
.gplan{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;border:1px solid var(--line);border-radius:12px}
.gplan button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-weight:700;font-size:.8rem;color:var(--muted)}
.gplan button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.amtin.sm span{font-size:1.4rem}
.amtin.sm input{font-size:1.6rem}
.gitems{margin-top:12px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.gitm-h{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.gitm-h span{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitm small{display:block;margin-top:5px;font-size:.8rem;color:var(--muted)}
.gbar.sm{height:6px;margin-top:6px}
.gwarnbox{display:flex;flex-direction:column;gap:3px;margin-top:12px;border:1.5px solid var(--want);background:color-mix(in srgb,var(--want) 12%,transparent);border-radius:12px;padding:10px 12px;font-size:.86rem}
.gchk.off{border-style:dashed;opacity:.5}
.gtwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.gtbl{display:grid;grid-template-columns:minmax(76px,1.2fr) repeat(var(--n),minmax(64px,1fr)) 38px;min-width:min-content}
.gtbl .gamt{font-size:.88rem;padding:4px;margin:-4px -4px -4px 0}
.gtbl .gpaid{font-size:.88rem}
.gtbl .gd>span{font-size:.95rem;white-space:nowrap}
.gtr{display:contents}
.gtr>*{padding:8px 0;border-bottom:1px solid var(--line);display:flex;align-items:center}
.gtr>.gc{justify-content:flex-end;flex-direction:column;align-items:flex-end;justify-content:center;padding-right:6px}
.gtr>.gck{justify-content:flex-end}
.gth>*{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 6px 6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.gth>*:not(:first-child){text-align:right}
.gtbl .gmon{grid-column:1 / -1}
.gtbl .gd{flex-direction:column;align-items:flex-start;padding-right:6px}
.gtbl .gd small{font-size:.74rem;color:var(--muted);line-height:1.3}
.gtbl .gd small .chg{color:var(--want);font-weight:600}
.gedl{border:0;background:transparent;padding:0;color:var(--want);font-weight:700;font-size:.76rem}
.gpool{display:block;font-size:.72rem;color:var(--muted)}
.gpool.over{color:var(--over);font-weight:600}
.gtr.op>*{border-bottom:0}
.gtr>.gedx{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:0 0 10px;padding:8px 10px;border-radius:10px;background:var(--track);font-size:.8rem;color:var(--ink);border-bottom:0}
.gedx b{font-weight:600}
.gclr{border:0;background:transparent;padding:0;margin-left:auto;font-weight:700;font-size:.8rem;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.gtr.op+.gtr>*,.gtr.op+.gmon{border-top:1px solid var(--line)}
.gtbl .gd small .miss{color:var(--over)}
.gtr.next .gd>span{font-weight:700}
.gtr.next .gchk{border-color:var(--hero)}
.gtr.done .gchk,.gtbl .gchk.on{background:var(--gbar);border-color:var(--gbar);color:#fff}
.gtr.done .gd>span{color:var(--muted)}
.gc small{font-size:.72rem;color:var(--muted);white-space:nowrap}
.gc .gnil{color:var(--muted)}
.gc .gpaid{color:var(--muted);font-weight:700;text-decoration:line-through}
.gc .gedit{width:84px}
.grw.ghead{border-bottom:1px solid var(--line);padding:12px 0 6px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.grw.ghead span:not(:first-child){text-align:right}
.grw .greq{text-align:right;color:var(--muted);font-weight:600;white-space:nowrap;font-size:.92rem}
.grw .ga{text-align:right}
.gamt{border:0;background:transparent;font-weight:700;padding:6px 6px;margin:-6px -6px -6px 0;border-radius:8px;white-space:nowrap;color:var(--ink)}
.gamt:hover{background:var(--track)}
.grw .gd small .chg{color:var(--want);font-weight:600}
.gedit{width:88px;border:1.5px solid var(--hero);border-radius:9px;padding:6px 8px;text-align:right;font-weight:700;background:var(--bg)}
.grw .gd small .miss{color:var(--over)}
.ghero .gview{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.12);margin-bottom:6px}

    if (S.mode === "db") await col.doc(id).set(data);
    else if (S.mode === "api"){ const r = await API.call("data/"+id, {method:"PUT", body: JSON.stringify(data)}); if (r && r.merged) apiReload().then(render).catch(()=>{}); }

  }).catch(e => { toast(e && e.code==="quota_exceeded" ? "Storage is full. Delete old entries to keep saving." : "That change didn't save. Check your connection and try again."); });
  return queues[id];
}
function ingest(docs){
  const months = {}; let settings = null, nw = null, nwHist = null, goals = null;
  S.tomb = [];
  for (const [id,d] of docs){ if (id==="settings") settings=d; else if (id==="tombstones") S.tomb=(d&&d.ids)||[]; else if (id==="networth") nw=d; else if (id==="nwhist") nwHist=d; else if (id==="goals") goals=d; else if (d && d.month) months[d.month]=d; }
  S.nw = nw; S.nwHist = nwHist; S.goals = goals;
  const moved = new Set();
  for (const k of Object.keys(months)){
    const stay = [], go = [];
    for (const t of (months[k].tx||[])) (t.date && monthOfIso(t.date)!==k ? go : stay).push(t);
    if (!go.length) continue;
    months[k] = {...months[k], tx: stay}; moved.add(k);
    for (const t of go){ const nk = monthOfIso(t.date); months[nk] = months[nk] ? {...months[nk], tx: (months[nk].tx||[]).filter(x=>x.id!==t.id).concat([t])} : {kind:"month", month:nk, tx:[t]}; moved.add(nk); }
  }
  S.months = months; S.settings = normalizeSettings(settings || S.settings || DEFAULT_SETTINGS, months);
  for (const k of moved) persist("m-"+k, months[k]);
  if (settings && needsMigration(settings)) persist("settings", S.settings);   // save the new shape once
  if (!settings && S.ready===false && S.mode==="db") {/* first run for a new viewer */}
  S.ready = true; render();
}
function localLoad(){
  let all={}; try { all = JSON.parse(localStorage.getItem("wb-data")||"{}"); } catch(e){}
  ingest(Object.entries(all));
}
async function boot(){
  const c = window.claude && window.claude.use ? window.claude : null;
  if (!c){ await bootWeb(); return; }
  const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
  const id = user ? await user.id() : null;
  if (!db || !id){ S.mode="local"; localLoad(); return; }
  col = db.collection("data/users/"+id);
  col.onSnapshot(snap => ingest(snap.docs.filter(d=>d.exists).map(d=>[d.id, clone(d.data())])),
    () => { S.mode="local"; localLoad(); });
}
/* ---------- derived ---------- */
const cfgFor = k => { let v=null; for (const x of S.settings.versions) if (x.from<=k) v=x; return v || {from:null, categories:[]}; };
const nextChange = k => (S.settings.versions.find(x=>x.from>k)||{}).from || null;
const monthDoc = k => S.months[k] || {kind:"month", month:k, tx:[]};
const monthTx = k => (S.months[k]?.tx) || [];
/* Bill frequencies. The amount is what one bill costs.
   Weekly and every-2-weeks bills follow your pay schedule (from Goals): a month with 3 biweekly paydays gets 3 of that bill.
   Bills that come every 2 months, every 3 months or once a year get an even monthly share. */
const BILL_FREQS = [["weekly","Weekly",7],["biweekly","Biweekly",14],["monthly","Monthly",1],["bimonthly","Bimonthly",2],["quarterly","Quarterly",3],["yearly","Yearly",12]];   // bimonthly = every 2 months
const freqLabel = f => (BILL_FREQS.find(x=>x[0]===f)||BILL_FREQS[2])[1];
function billTimes(c, k){
  const f = c.freq || "monthly"; if (c.group!=="bill" || f==="monthly") return 1;
  const every = (BILL_FREQS.find(x=>x[0]===f)||[])[2] || 1;
  if (f!=="weekly" && f!=="biweekly") return 1/every;
  const last = S.goals && S.goals.pay && S.goals.pay.last;
  const anchor = last ? parseISO(last) : new Date(2026, 0, 2);   // no pay schedule yet: count Fridays
  const a = new Date(mkeyParts(k).y, mkeyParts(k).m-1, 1), b = lastOfMonth(k);
  const off = Math.round((a - anchor) / 864e5), first = addDays(a, ((-off % every) + every) % every);
  let n = 0; for (let d = first; d <= b; d = addDays(d, every)) n++; return n;
}
/* What a bill's line says about its frequency */
function billNote(c, k){
  const f = c.freq || "monthly", t = billTimes(c, k);
  if (f==="monthly") return "";
  if (f==="weekly" || f==="biweekly") return `${freqLabel(f).toLowerCase()} · ${t} this month`;
  return `${freqLabel(f).toLowerCase()} · split monthly`;
}
const budgetFor = k => cfgFor(k).categories.map(c => c.group==="bill" && c.freq && c.freq!=="monthly" ? {...c, per:+c.limit||0, limit: round2((+c.limit||0)*billTimes(c,k))} : c);
const sum = arr => round2(arr.reduce((a,t)=>a+(t.ignored?0:t.amount),0));
/* A hold: a purchase from your bank's text, or one your bank hasn't processed yet. It counts now and is confirmed once the charge goes through. */
const isHold = t => t.source==="text" || !!t.pending;
const spendSum = arr => round2(arr.reduce((a,t)=>a+(t.ignored || catGroup(monthOfIso(t.date),t.cat)==="bill" ? 0 : t.amount),0));
const catGroup = (k, name) => { const c = budgetFor(k).find(c=>c.name===name); if (c) return c.group; for (const v of S.settings.versions.slice().reverse()){ const x=v.categories.find(c=>c.name===name); if (x) return x.group; } };

function monthStats(k){
  const tx = monthTx(k); let spending = 0, bills = 0;
  for (const t of tx){ if (t.ignored) continue; if (catGroup(k,t.cat)==="bill") bills += t.amount; else spending += t.amount; }

}
function weekTx(w, onlyMonth){ const a=iso(w), b=iso(addDays(w,6)); const ks=[...new Set([mkeyOf(w), mkeyOf(addDays(w,6))])].filter(k=>!onlyMonth||k===onlyMonth); return ks.flatMap(k=>monthTx(k)).filter(t=>t.date>=a && t.date<=b); }

/* ---------- components ---------- */
function budgetBlock(k, wk, expand, only, bare){

      const w = round2(wsp[c.name]||0), wpct = (wk && l && w>0) ? Math.min(pct, w/l*100) : 0;

const niceStep = raw => { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; };

  const xlab = (t, anchor, text) => `<text class="tk" x="${f(anchor==="start"?Math.max(2,X(t)):anchor==="end"?Math.min(W-2,X(t)):X(t))}" y="${H-5}" text-anchor="${anchor}">${text}</text>`;

/* ---------- goals: pay off a debt or save for something, planned paycheck by paycheck ---------- */
icon.plus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
icon.check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const FREQS = [["weekly","Every week",52],["biweekly","Every 2 weeks",26],["semimonthly","Twice a month",24],["monthly","Once a month",12]];
const perYear = f => (FREQS.find(x=>x[0]===f)||FREQS[1])[2];

/* Every payday from a to b (ISO dates, inclusive), worked out from your last payday and how often you're paid */
function paydays(pay, a, b){

    const dt = new Date(y, m, 1), endDay = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
    const days = pay.freq==="semimonthly" ? [15, endDay] : [Math.min(last.getDate(), endDay)];
    let past = false;
    for (const dd of days){ const v = iso(new Date(dt.getFullYear(), dt.getMonth(), dd)); if (v > b){ past = true; break; } if (v >= a) out.push(v); }
    if (past) break;
  }

}
const mpCache = new Map();
const monthPaydays = (pay, k) => { const key = `${pay.last}|${pay.freq}|${k}`; let v = mpCache.get(key); if (!v){ v = paydays(pay, k+"-01", iso(lastOfMonth(k))); if (mpCache.size > 5000) mpCache.clear(); mpCache.set(key, v); } return v; };
const nextPayday = pay => paydays(pay, iso(today()), iso(addDays(today(), 70)))[0] || null;
const fmtDay = d => { const x = parseISO(d); return `${DOWL[x.getDay()].slice(0,3)}, ${shortDate(x)}`; };
const fmtDayY = d => { const x = parseISO(d); return `${shortDate(x)}, ${x.getFullYear()}`; };
const billsOf = k => budgetFor(k).filter(c=>c.group==="bill");

/* What a month's pay leaves for goals: paychecks that month, minus that month's bills (and needs and wants, if you count them) */
function monthMoney(k){
  const pay = gDoc().pay; if (!pay) return null;
  const n = monthPaydays(pay, k).length, take = +pay.amount || 0, cats = budgetFor(k);
  const bills = round2(cats.filter(c=>c.group==="bill").reduce((a,c)=>a+(+c.limit||0),0));
  const nw = pay.countNW ? round2(cats.filter(c=>c.group==="need"||c.group==="want").reduce((a,c)=>a+(+c.limit||0),0)) : 0;
  return {n, take, pay: round2(take*n), bills, nw, avail: round2(take*n - bills - nw)};

/* A debt paid by one of your Spending bills: that bill's payment is the required part of each paycheck.

function requiredOn(g, pay, d){

  const pd = monthPaydays(pay, k); if (!pd.length) return 0;

/* The roadmap for one goal, from its start date: each payday's required payment (if a bill pays it) and the extra on top.

   or are the amount per paycheck you chose (and then the finish date is worked out). Debts with a rate grow between paydays. */
function goalPlan(g, pay, start, end, share){
  const t = iso(today()), debt = g.type==="debt", set = g.set || {};
  const r = debt && +g.apr>0 ? g.apr/100/perYear(pay.freq) : 0;
  const owed0 = Math.max(0, +g.amount||0);   // the amount left (paid-off payments are already taken out)
  const initial = Math.max(owed0, +g.initial||0) || owed0;
  const byDate = g.planMode!=="amount";

  const horizon = byDate ? end : iso(addDays(parseISO(start), 365*40));
  const days = byDate && (!end || end<start) ? [] : paydays(pay, start, horizon).slice(0, 2200);

      rows.push({d, req: round2(req), ex: round2(ex), bal: round2(Math.max(0, bal)),

    }

  };
  let X = 0;
  if (byDate){

      if (sim(hi).bal > 0.005) X = hi; else { for (let k=0; k<50; k++){ const mid = (lo+hi)/2; if (sim(mid).bal > 0.005) lo = mid; else hi = mid; } X = Math.ceil(hi*100)/100; } }

/* Works out every goal's dates: a goal that starts after another one starts the day after that one finishes */
/* When a goal that comes after another one starts. If the earlier goal's last extra payment is smaller than its usual extra,

function afterStart(R, prevName){

function resolveGoals(list, pay){

    if (out[g.id]) return out[g.id];

      let ctx = null, after = null;
      if (g.startMode==="after"){ const p = list.find(x=>x.id===g.after); if (p && !busy.has(p.id)){ busy.add(g.id); const R = run(p); busy.delete(g.id); after = p; ctx = afterStart(R, p.name); } }
      const P = groupPlan(g, pay, ctx); return out[g.id] = {start: P.start, end: null, after, share: ctx ? ctx.share : null, P};
    }
    let start = g.start || iso(today()), after = null, share = null;
    if (g.startMode==="after"){
      const p = list.find(x=>x.id===g.after);
      if (p && !busy.has(p.id)){ busy.add(g.id); const R = run(p); busy.delete(g.id); after = p; ({start, share} = afterStart(R, p.name)); }
    }
    if (start && g.asOf && start <= g.asOf){ start = iso(addDays(parseISO(g.asOf), 1)); if (share && share.d < start) share = null; }

    return out[g.id] = {start, end, after, share, P: goalPlan(g, pay, start, end, share)};

/* Payments checked off ahead of their date: shown as done until the date passes */
const earlyRows = g => Object.entries(g.early||{}).filter(([d])=>d>=iso(today())).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,e])=>({d, req:+e.req||0, ex:+e.ex||0, parts:e.parts||[], status:"done"}));

    avail = mm.avail; goalsAmt = goalsOn(x=>x.slice(0,7)===k); place = MONTHS[mkeyParts(k).m-1];
    nav = `${monthName(k)} · ${mm.n} ${mm.n===1?"paycheck":"paychecks"}`;
    lines = `<div><span>Pay (${mm.n} × ${money(mm.take)})</span><b>${money(mm.pay)}</b></div>

function goalFromDraft(d, id){

  const left = id ? (nwAmt(d.left) ?? initial) : Math.max(0, initial - (d.type==="save" ? (nwAmt(d.startAmt)||0) : 0));
  const g = {id: id || "draft", type:d.type, name:(d.name||"").trim(), initial, amount:left,
    apr:d.type==="debt"&&d.apr!==""?parseFloat(d.apr)||0:null, bill:d.type==="debt"&&d.bill?d.bill:null,
    startMode:d.startMode, start:d.start, after:d.startMode==="after"?d.after:null, planMode:d.planMode,
    end:d.planMode==="date"?d.end:null, perPay:d.planMode==="amount"?(nwAmt(d.perPay)||0):null, set:{}};
  const old = id && gDoc().list.find(x=>x.id===id); if (old){ g.set = old.set||{}; if (old.asOf) g.asOf = old.asOf; }
  if (g.startMode==="after" && g.planMode==="date"){
    // keep the same length of time between start and target date, so it moves with the goal before it
    const others = gDoc().list.filter(x=>x.id!==g.id).concat([{...g, startMode:"date"}]);

/* Check off a group's paycheck: every item's share comes off what's left (paydays go in order) */
function groupCheck(doc, g, d){
  const t = iso(today());
  if (g.early && g.early[d]){
    const e = g.early[d]; for (const it of g.items){ if (e.prev && e.prev[it.id]!=null) it.amount = e.prev[it.id]; }
    if (e.prevAsOf) g.asOf = e.prevAsOf; else delete g.asOf; g.set = {...(g.set||{}), ...(e.prevSet||{})}; g.setItem = {...(g.setItem||{}), ...(e.prevSetItem||{})}; delete g.early[d];
    gPut(doc); toast(`Undone. ${money(g.items.reduce((a,it)=>a+(+it.amount||0),0))} left`); return;
  }
  const P = resolveGoals(gDoc().list, doc.pay)[g.id].P, row = P.rows.find(x=>x.d===d); if (!row) return;
  const prev = {}; g.items.forEach((it,i)=>{ prev[it.id] = +it.amount||0; it.initial = Math.max(+it.initial||0, +it.amount||0); it.amount = row.bals[i]; });
  const prevSet = {}; if (g.set) for (const k of Object.keys(g.set)) if (k <= d){ prevSet[k] = g.set[k]; delete g.set[k]; }
  const prevSetItem = {}; if (g.setItem) for (const k of Object.keys(g.setItem)) if (k <= d){ prevSetItem[k] = g.setItem[k]; delete g.setItem[k]; }
  if (d >= t){ g.early = g.early || {}; g.early[d] = {req: row.req, ex: row.ex, parts: row.parts, prev, prevAsOf: g.asOf || null, prevSet, prevSetItem}; }

}

async function connectBank(itemId, kind="bank"){

    await loadPlaidScript();
    const { link_token } = await API.call("plaid/link-token", {method:"POST", body: JSON.stringify(itemId?{item_id:itemId}:{kind})});
    const handler = window.Plaid.create({ token: link_token,
      onSuccess: async (public_token, meta) => {
        if (itemId){ toast("Connection updated"); syncNow(); return; }
        P.busy = true; render();
        const name = meta?.institution?.name || "Account";
        try { const r = await API.call("plaid/exchange", {method:"POST", body: JSON.stringify({public_token, institution: meta?.institution?.name, kind})});

        catch(e){ toast(e.message || "Linking didn't finish. Try again."); }
        P.busy = false; render();
      },
      onExit: (err) => { if (err) toast(err.display_message || "Linking was cancelled."); } });
    handler.open();
  } catch(e){ toast(e.message || "Couldn't start linking. Try again."); }
}

}
document.addEventListener("change", async e => {
  if (e.target.id!=="importIn") return;
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const docs = j.docs || {};
    const ids = Object.keys(docs).filter(id=>/^(settings|tombstones|networth|nwhist|goals|m-\d{4}-\d{2})$/.test(id));
    if (!ids.includes("settings")) throw new Error("That file isn't a Weekly Budget backup.");
    for (const id of ids) await persist(id, docs[id]);
    const merged = {}; merged.settings=S.settings; merged.tombstones={ids:S.tomb}; if (S.nw) merged.networth=S.nw; if (S.nwHist) merged.nwhist=S.nwHist; if (S.goals) merged.goals=S.goals; for (const k in S.months) merged["m-"+k]=S.months[k];
    for (const id of ids) merged[id]=docs[id];
    ingest(Object.entries(merged)); toast(`Restored ${ids.length} item${ids.length===1?"":"s"} from the backup`);
  } catch(err){ toast(err.message || "Couldn't read that file."); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible" && S.mode==="api" && !S.locked){ apiReload().then(()=>loadItems(true)).catch(()=>{}); } });

/* ---------- settings ---------- */
let draft = null, setMonth = null;
function openSettings(){
  setMonth = V.tab==="week" ? mkeyOf(weekRef(V.week)) : V.tab==="month" ? V.month : mkeyOf(today());
  const c = cfgFor(setMonth); draft = {categories: clone(c.categories).map(x=>({...x,_o:x.name})), base: clone({categories:c.categories})};
  drawSettings(); $("#setDlg").showModal(); $("#setBody").focus({preventScroll:true});
}
/* Under each bill in settings: what that frequency comes to this month */
function billHint(c){
  const f = c.freq || "monthly", t = billTimes(c, setMonth), amt = +c.limit||0, mon = MONTHS[mkeyParts(setMonth).m-1];
  if (f==="monthly") return "Amount per bill";
  if (f==="weekly" || f==="biweekly") return `${t}× in ${mon} = ${money(amt*t)}${S.goals&&S.goals.pay?"":". Set your pay schedule in Goals to match your paydays"}`;
  return `${money(amt*t)} a month`;
}
function drawSettings(){
  const tot = g => draft.categories.filter(c=>!g||c.group===g).reduce((a,c)=>a+(+c.limit||0)*billTimes(c,setMonth),0);
  const G = [["need","Needs","Add a need"],["want","Wants","Add a want"],["bill","Bills","Add a bill"]];
  const freqRow = (c,i) => c.group!=="bill" ? "" : `<div class="srow2"><select class="inp" data-c="${i}" data-f="freq" aria-label="How often ${esc(c.name)} is due">${BILL_FREQS.map(([v,l])=>`<option value="${v}" ${(c.freq||"monthly")===v?"selected":""}>${l}</option>`).join("")}</select><span class="srhint" data-bh="${i}">${billHint(c)}</span></div>`;
  const row = (c,i) => `<div class="${c.group==="bill"?"sbill":""}"><div class="srow"><input class="inp" data-c="${i}" data-f="name" value="${esc(c.name)}" aria-label="Name"><select class="inp" data-c="${i}" data-f="group" aria-label="Need, want or bill"><option value="need" ${c.group==="need"?"selected":""}>Need</option><option value="want" ${c.group==="want"?"selected":""}>Want</option><option value="bill" ${c.group==="bill"?"selected":""}>Bill</option></select><input class="inp" data-c="${i}" data-f="limit" inputmode="decimal" value="${c.limit}" aria-label="Monthly amount"><button type="button" class="icon" data-crm="${i}" aria-label="Remove ${esc(c.name)}">${icon.x}</button></div>${freqRow(c,i)}</div>`;
  $("#setBody").innerHTML = `<h3>Budget for ${monthName(setMonth)}<button type="button" class="icon" data-sclose aria-label="Close">${icon.x}</button></h3>
  <p class="note" style="margin-top:-8px">Changes start in ${monthName(setMonth)} and carry forward to every month after. Earlier months stay as they are.${nextChange(setMonth)?" If you changed the same item separately in a later month, that later change is kept from then on.":""}</p>
  <div class="sub" style="margin-top:14px">${monthName(setMonth)} budget <span>${money(tot())}</span></div>
  <p class="note" style="margin-top:-4px">Weekly and biweekly bills count your paydays in ${MONTHS[mkeyParts(setMonth).m-1]}. Bimonthly (every 2 months), quarterly and yearly bills are split into a monthly share.</p>
  ${G.map(([g,label,add])=>`<div class="sgrp"><div class="sgh"><span><i class="sw" style="background:${catColor(g)}"></i>${label}</span><span>${money(tot(g))}</span></div>
    ${draft.categories.map((c,i)=>c.group===g?row(c,i):"").join("")}
    <button type="button" class="add" data-cadd="${g}">${add}</button></div>`).join("")}
  <div class="actions"><button type="button" class="btn sec" data-sclose>Cancel</button><button type="button" class="btn pri" data-ssave>Save changes</button></div>`;
}
function refreshTotals(){
  const tot = g => draft.categories.filter(c=>!g||c.group===g).reduce((a,c)=>a+(+c.limit||0)*billTimes(c,setMonth),0);
  const subs = document.querySelectorAll("#setBody .sgh span:last-child"); ["need","want","bill"].forEach((g,i)=>{ if (subs[i]) subs[i].textContent = money(tot(g)); });
  const all = document.querySelector("#setBody .sub span"); if (all) all.textContent = money(tot());
}
$("#setDlg").addEventListener("input", e => {
  const el = e.target; const f = el.dataset.f; if (!f) return;
  if (el.dataset.c!==undefined){
    const c = draft.categories[+el.dataset.c]; c[f] = f==="limit" ? (parseFloat(el.value)||0) : el.value;
    if (f==="freq" && c.freq==="monthly") delete c.freq;
    if (f==="group" || f==="freq") drawSettings(); else if (f==="limit"){ refreshTotals(); const h = document.querySelector(`#setBody [data-bh="${el.dataset.c}"]`); if (h) h.textContent = billHint(c); }
  }
});
$("#setDlg").addEventListener("click", e => {
  const dlg=$("#setDlg"); const t=e.target;
  if (t===dlg || t.closest("[data-sclose]")){ dlg.close(); return; }
  const g = s => t.closest(s);
  if (g("[data-crm]")){ draft.categories.splice(+g("[data-crm]").dataset.crm,1); drawSettings(); }
  else if (g("[data-cadd]")){ const grp=g("[data-cadd]").dataset.cadd||"need"; draft.categories.push({name:grp==="bill"?"New bill":grp==="want"?"New want":"New need",group:grp,limit:0}); drawSettings(); const ins=document.querySelectorAll(`#setBody [data-f="name"]`); const last=ins[ins.length-1]; if (last){ last.focus(); last.select(); } }
  else if (g("[data-ssave]")){
    const cats = draft.categories.filter(c=>c.name.trim()).map(c=>{ const x = {...c,name:c.name.trim(),limit:round2(+c.limit||0)}; delete x.due; if (x.group!=="bill" || !x.freq || x.freq==="monthly") delete x.freq; return x; });
    const st = clone(S.settings);
    /* Carry each change forward into later months, unless that month changed the same item on its own */
    const carry = (baseList, newList, laterList, fields) => {
      let out = clone(laterList);
      for (const b of baseList){
        const n = newList.find(x=>x._o===b.name); const i = out.findIndex(x=>x.name===b.name);
        if (!n){ if (i>=0 && fields.every(f=>out[i][f]===b[f])) out.splice(i,1); continue; }
        if (i<0) continue;
        for (const f of fields) if (n[f]!==b[f] && out[i][f]===b[f]) out[i][f]=n[f];
        if (n.name!==b.name && !out.some(x=>x.name===n.name)) out[i].name=n.name;
      }
      for (const n of newList) if (!n._o && !out.some(x=>x.name===n.name)){ const {_o, ...rest}=n; out.push(rest); }
      return out.map(({_o, ...rest})=>rest);
    };
    const strip = l => l.map(({_o, ...rest})=>rest);
    st.versions = st.versions.map(v => v.from>setMonth ? {...v, categories: carry(draft.base.categories, cats, v.categories, ["group","limit","freq"])} : v);
    st.versions = st.versions.filter(v=>v.from!==setMonth).concat([{from:setMonth, categories:strip(cats)}]).sort((a,b)=>a.from<b.from?-1:1);
    const sig = v => JSON.stringify(v.categories);
    st.versions = st.versions.filter((v,i,arr)=> i===0 || sig(v)!==sig(arr[i-1]));
    S.settings = st; persist("settings", st);
    dlg.close(); toast(`Saved for ${monthName(setMonth)} onward`); render();
  }
});

/* ---------- no pinch or double-tap zoom ---------- */
["gesturestart","gesturechange","gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
/* double-tap zoom is turned off by touch-action:manipulation on the page */

/* ---------- number boxes: the first keystroke replaces what's there ---------- */
const isNumBox = el => el && el.matches && el.matches('input[inputmode="decimal"]');
document.addEventListener("focusin", e => { const el = e.target; if (isNumBox(el)) el.dataset.fresh = "1"; });
document.addEventListener("focusout", e => { if (isNumBox(e.target)) delete e.target.dataset.fresh; });
document.addEventListener("beforeinput", e => {
  const el = e.target; if (!isNumBox(el) || el.dataset.fresh!=="1") return;
  delete el.dataset.fresh;
  if (!e.inputType || !e.inputType.startsWith("insert")) return;   // backspace etc. behave normally
  const text = e.data ?? (e.dataTransfer && e.dataTransfer.getData("text/plain")) ?? "";
  e.preventDefault();
  el.value = text; el.setSelectionRange(text.length, text.length);
  el.dispatchEvent(new Event("input", {bubbles:true}));
}, true);

let tt; function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2400); }

boot().catch(() => { S.mode="local"; localLoad(); });
setTimeout(()=>{ if(!S.ready){ S.mode="local"; localLoad(); } }, 12000);
})();
</script>
