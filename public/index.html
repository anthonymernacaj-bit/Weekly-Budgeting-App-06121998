<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Budget</title>
<meta name="theme-color" content="#EDF1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1510" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --ink:#17251D; --muted:#617066; --line:#D3DCD1; --track:#DEE6DB;
  --hero:#1E4A37; --hero-ink:#EAF3EC; --hero-muted:#A9C4B3; --hero-bar:#8FC7A6;
  --need:#2D6A4C; --want:#B8741A; --over:#B0392A; --bill:#5E7C8A;
  --font:"Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --grad:radial-gradient(75% 42% at 0% 0%,rgba(150,196,165,.55) 0%,rgba(150,196,165,.18) 45%,transparent 75%),#EDF1EA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#18211C; --ink:#E2EBE4; --muted:#8E9E94; --line:#29352E; --track:#233029;
    --hero:#163A2B; --hero-ink:#E6F2EA; --hero-muted:#93B3A0; --hero-bar:#6FB690;
    --need:#62B38C; --want:#E3A24B; --over:#E6705D; --bill:#7FA3B3;
    --grad:radial-gradient(75% 42% at 0% 0%,rgba(46,104,76,.85) 0%,rgba(24,60,43,.45) 42%,transparent 75%),linear-gradient(180deg,#0B1510 0%,#070D0A 100%);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18211C; --ink:#E2EBE4; --muted:#8E9E94; --line:#29352E; --track:#233029;
  --hero:#163A2B; --hero-ink:#E6F2EA; --hero-muted:#93B3A0; --hero-bar:#6FB690;
  --need:#62B38C; --want:#E3A24B; --over:#E6705D; --bill:#7FA3B3;
  --grad:radial-gradient(75% 42% at 0% 0%,rgba(46,104,76,.85) 0%,rgba(24,60,43,.45) 42%,transparent 75%),linear-gradient(180deg,#0B1510 0%,#070D0A 100%);
}
*,*::before,*::after{box-sizing:border-box}
/* Fixed gradient layer (works on iPhone, where background-attachment:fixed doesn't) */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--grad);pointer-events:none}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
input,textarea{caret-color:transparent}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--want);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:12px 18px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.nav{display:flex;align-items:center;gap:4px}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon:hover{background:var(--track)}
.icon svg{width:20px;height:20px}
.title{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;width:7.4rem;text-align:center;white-space:nowrap}
.title.wide{width:8.8rem}
.jump{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.banner{font-size:.85rem;color:var(--muted);background:var(--track);border-radius:10px;padding:8px 12px;margin-bottom:12px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:22px 20px 16px;margin-bottom:26px;border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hero .lbl{color:var(--hero-muted);font-size:.9rem}
.hero .big{font-weight:800;font-size:clamp(2.6rem,11vw,3.6rem);letter-spacing:-.035em;line-height:1;margin:4px 0 18px}
.hero .big .c{font-size:.5em;letter-spacing:0;font-weight:700;vertical-align:.62em;margin-right:2px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.day{border:0;background:transparent;color:inherit;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.day .col{width:100%;height:92px;display:flex;align-items:flex-end;justify-content:center;border-radius:8px;background:rgba(255,255,255,.06)}
.day .bar{width:100%;border-radius:8px;background:var(--hero-bar);min-height:3px;transition:height .35s ease}
.day .amt{font-size:.72rem;color:var(--hero-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day .dn{font-size:.8rem;font-weight:600;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.day.today .dn{background:var(--hero-ink);color:var(--hero)}
.day.today .bar{background:var(--want)}
.day.sel .col{outline:2px solid var(--hero-ink);outline-offset:2px}
.day.dim .bar{opacity:.4}
.dayx{display:grid;grid-template-rows:1fr;margin-top:16px}
.dayx.grow{animation:dayOpen .28s ease-out}
@keyframes dayOpen{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
.dayx>.in{overflow:hidden;min-height:0;border-top:1px solid rgba(255,255,255,.16);padding-top:6px}
.dayx .dxh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 4px}
.dayx .dxh b{font-size:1rem}
.dayx .dxh .r{display:flex;align-items:center;gap:4px;color:var(--hero-muted);font-size:.9rem}
.dayx .icon{color:var(--hero-ink);width:34px;height:34px}
.dayx .icon:hover{background:rgba(255,255,255,.1)}
.hero .tx{border-bottom-color:rgba(255,255,255,.12);color:var(--hero-ink)}
.hero .tx:last-child{border-bottom:0}
.hero .tx .ct{color:var(--hero-muted)}
.hero .tx .a.neg{color:var(--hero-bar)}
.hero .empty{color:var(--hero-muted)}
.addday{border:1px dashed rgba(255,255,255,.3);background:transparent;color:var(--hero-ink);border-radius:12px;padding:10px;width:100%;font-weight:600;margin-top:10px}
.addday:hover{background:rgba(255,255,255,.06)}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:16px 18px;text-align:left}
.ph .pt{display:flex;flex-direction:column}
.ph .pt b{font-size:1.1rem;letter-spacing:-.015em}
.ph .pt span{font-size:.85rem;color:var(--muted)}
.ph .pr{display:flex;align-items:center;gap:10px;white-space:nowrap}
.ph .pr b{font-size:1.1rem}
.ph:hover .pt b{text-decoration:underline;text-underline-offset:3px}
.pbox.open{border-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.bbtn{display:block;width:100%;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.bbtn:hover .l>span:first-child{text-decoration:underline;text-underline-offset:3px}
.cx.open{padding-bottom:4px}
.catx{margin:10px 0 2px;padding-left:12px;border-left:3px solid var(--line)}
.catx .tx{padding:8px 0}
.catx .tx:last-child{border-bottom:0}
.wkx{border-bottom:1px solid var(--line)}
.wkx:last-child{border-bottom:0}
.wkh{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:12px 0;font-weight:600;text-align:left}
.wkh .r{color:var(--muted);font-weight:500}
.wkh:hover span:first-child{text-decoration:underline;text-underline-offset:3px}
.wkx.open .wkh{border-bottom:1px solid var(--line)}
.wkx .tx:last-child{border-bottom:0}
.pbox .brow:last-child{border-bottom:0}
.pbox .pin{border-top:1px solid var(--line);padding:0 18px 8px}
.pbox .daygrp:last-child .tx:last-child{border-bottom:0}

/* sections */
section{margin-bottom:30px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sh h2{font-size:1.2rem;font-weight:700;letter-spacing:-.015em;margin:0}
.sh .aside{color:var(--muted);font-size:.9rem;text-align:right}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fig{background:var(--surface);padding:14px 14px 12px}
.fig .k{font-size:.82rem;color:var(--muted)}
.fig .v{font-weight:700;font-size:1.15rem;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.fig.tot .v{font-weight:800}
.note{font-size:.85rem;color:var(--muted);margin-top:8px}

.grp{margin-bottom:18px}
.gh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.gh .n{font-weight:700;display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.gh .t{font-size:.9rem;color:var(--muted)}
.gh .t b{color:var(--ink)}
.brow{padding:10px 0;border-bottom:1px solid var(--line)}
.brow .l{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.brow .l span:last-child{color:var(--muted);white-space:nowrap}
.brow .l b{color:var(--ink);font-weight:600}
.track{height:8px;background:var(--track);border-radius:4px;margin-top:7px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.over .l span:last-child{color:var(--over)}
.over .fill{background:var(--over)!important}
.fill{position:relative;display:block}
.wseg{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px);border-radius:0 4px 4px 0}
.brow .l{flex-wrap:wrap;row-gap:2px}
.brow .l>span:last-child{margin-left:auto}
.brow .l .wk,.brow.over .l span.wk{font-size:.78rem;color:var(--muted);margin-left:8px;white-space:nowrap}

.daygrp{margin-bottom:6px}
.dh{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding:12px 0 4px;font-weight:600}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:hover .nt{text-decoration:underline;text-underline-offset:3px}
.tx .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .nm small{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx.ign .nt,.tx.ign .a{text-decoration:line-through;opacity:.5}
.tx .ct{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.tx .a{font-weight:600;white-space:nowrap;min-width:78px;text-align:right}
.tx .a.neg{color:var(--need)}
.empty{color:var(--muted);padding:14px 0;font-size:.95rem}

.wbars{display:flex;flex-direction:column;gap:8px}
.wb{display:grid;grid-template-columns:92px 1fr 84px;gap:10px;align-items:center;font-size:.9rem;border:0;background:transparent;padding:4px 0;text-align:left;width:100%}
.wb .r{text-align:right;font-weight:600}
.wb .track{margin:0;height:12px}
.wb .fill{background:var(--need)}
.wb:hover .l{text-decoration:underline;text-underline-offset:3px}

.ychart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.mtable{width:100%;border-collapse:collapse;font-size:.92rem}
.mtable th{text-align:right;font-weight:500;color:var(--muted);font-size:.82rem;padding:6px 0 6px 8px;border-bottom:2px solid var(--ink)}
.mtable th:first-child,.mtable td:first-child{text-align:left;padding-left:0}
.mtable td{text-align:right;padding:9px 0 9px 8px;border-bottom:1px solid var(--line)}
.mtable tr.click{cursor:pointer}
.mtable tr.click:hover td:first-child{text-decoration:underline;text-underline-offset:3px}
.mtable td.b{font-weight:700}
.mtable tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}

details.wk{border-bottom:1px solid var(--line)}
details.wk summary{list-style:none;display:flex;justify-content:space-between;padding:12px 0;cursor:pointer;font-weight:600}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary .r{color:var(--muted);font-weight:500}
details.wk[open] summary{border-bottom:1px solid var(--line)}
details.wk .tx:last-child{border-bottom:0}

/* tabs + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;height:60px}
.tab{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.92rem;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;background:var(--want);color:#1b1206;font-weight:700;padding:14px 20px 14px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(30,40,20,.25)}
.fab svg{width:20px;height:20px}

/* sheets */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-width:100%;max-height:92vh;border-radius:22px 22px 0 0;margin:auto auto 0}
dialog::backdrop{background:rgba(10,20,14,.45)}
@media (min-width:640px){dialog{border-radius:22px;margin:auto}}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:92vh}
.sheet h3{margin:0 0 16px;font-size:1.2rem;letter-spacing:-.015em;display:flex;justify-content:space-between;align-items:center}
.amtin{display:flex;align-items:center;border-bottom:2px solid var(--ink);margin-bottom:6px}
.amtin span{font-size:2rem;font-weight:700;color:var(--muted)}
.amtin input{border:0;background:transparent;font-size:2.4rem;font-weight:800;letter-spacing:-.03em;width:100%;padding:4px 6px;outline:none}
.field{margin-top:16px}
.field label,.flabel{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:7px;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:10px;margin-top:24px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;flex:1}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--track)}
.btn.del{background:transparent;color:var(--over);flex:0 0 auto}
.srow{display:grid;grid-template-columns:1fr 92px 96px 36px;gap:8px;align-items:center;margin-bottom:8px}
.sgrp{margin-bottom:14px}
.sgh{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;font-weight:600;padding:8px 0 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sgh span:first-child{display:flex;align-items:center;gap:8px}
.sgh span:last-child{color:var(--muted);font-weight:500}
.srow .inp{padding:10px 10px;font-size:.92rem}
.srow select.inp{padding:10px 6px}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:10px;width:100%;color:var(--muted);font-weight:600;margin-top:4px}
.sub{font-weight:700;margin:22px 0 8px;display:flex;justify-content:space-between}
.sub span{font-weight:500;color:var(--muted);font-size:.9rem}
.acct{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.acct .an{display:flex;flex-direction:column;gap:2px;min-width:0}
.acct .an span{font-size:.85rem;color:var(--muted)}
.acct .an span.bad{color:var(--over)}
.acct .aa{display:flex;gap:6px;flex:none}
.jump.warn,.btn.warn{color:var(--over);border-color:var(--over)}
.btn:disabled{opacity:.5;cursor:default}
.fab[hidden]{display:none}
body.locked .tabs,body.locked .fab{display:none}
.pacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pacts .btn{flex:1 1 auto;white-space:nowrap;padding:13px 16px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.figs{grid-template-columns:1fr 1fr}.fig.tot{grid-column:1/-1}.srow{grid-template-columns:1fr 84px 80px 32px}}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="loading">Loading your budget…</div></main>

<nav class="tabs" aria-label="Views"><div class="in">
  <button class="tab" data-tab="week" aria-current="page">Week</button>
  <button class="tab" data-tab="month">Month</button>
  <button class="tab" data-tab="year">Year</button>
</div></nav>
<button class="fab" id="fab" aria-label="Add a purchase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>

<dialog id="txDlg"><form class="sheet" id="txForm" method="dialog"></form></dialog>
<dialog id="setDlg"><div class="sheet" id="setBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<datalist id="merchants"></datalist>
<input type="file" id="importIn" accept="application/json,.json" hidden>

<script>
(() => {
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtUSD = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
const money = n => { const v = Math.round((n||0)*100)/100; return (v<0?"−":"") + fmtUSD.format(Math.abs(v)); };
const moneyShort = n => { const a=Math.abs(n); const s=a>=1000?"$"+(a/1000).toFixed(a>=10000?0:1)+"k":"$"+Math.round(a); return (n<0?"−":"")+s; };
const round2 = n => Math.round(n*100)/100;
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const sow = d => addDays(d,-d.getDay());
/* A week belongs to the month its Saturday falls in (same rule as the spreadsheet) */
const mkeyOf = d => { const s=addDays(sow(d),6); return `${s.getFullYear()}-${pad(s.getMonth()+1)}`; };
const mkeyParts = k => { const [y,m]=k.split("-").map(Number); return {y,m}; };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["S","M","T","W","T","F","S"];
const DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const monthName = k => { const {y,m}=mkeyParts(k); return `${MONTHS[m-1]} ${y}`; };
const shiftMonth = (k,n) => { const {y,m}=mkeyParts(k); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };

const DEFAULT_CATS = [{name:"Gas",group:"need",limit:150},{name:"Groceries",group:"need",limit:300},{name:"Misc",group:"need",limit:200},{name:"Dining Out",group:"want",limit:200}];
const DEFAULT_SETTINGS = { kind:"settings", versions:[], merchants:{} };
/* Settings are effective-dated: each version applies from its month until the next version */
function normalizeSettings(st, months){
  st = clone(st);
  if (!Array.isArray(st.versions) || !st.versions.length){
    const first = Object.keys(months||{}).sort()[0] || mkeyOf(new Date());
    st.versions = [{from:first, categories: st.categories || clone(DEFAULT_CATS), bills: st.bills || []}];
  }
  delete st.categories; delete st.bills;
  st.versions = st.versions.map(v => {
    const cats = (v.categories||[]).map(c=>({name:c.name, group:c.group||"need", limit:+c.limit||0}));
    for (const b of (v.bills||[])) if (!cats.some(c=>c.name===b.name)) cats.push({name:b.name, group:"bill", limit:+b.amount||0});
    return {from:v.from, categories:cats};
  });
  st.versions.sort((a,b)=>a.from<b.from?-1:1); st.merchants = st.merchants||{};
  return st;
}
const needsMigration = st => !!st && (Array.isArray(st.bills) || (st.versions||[]).some(v=>Array.isArray(v.bills)));

let col = null; const queues = {};
function persist(id, data){
  queues[id] = (queues[id]||Promise.resolve()).then(async () => {
    if (S.mode === "db") await col.doc(id).set(data);
    else if (S.mode === "api") await API.call("data/"+id, {method:"PUT", body: JSON.stringify(data)});
    else { try { const all = JSON.parse(localStorage.getItem("wb-data")||"{}"); all[id]=data; localStorage.setItem("wb-data", JSON.stringify(all)); } catch(e){} }
  }).catch(e => { toast(e && e.code==="quota_exceeded" ? "Storage is full. Delete old entries to keep saving." : "That change didn't save. Check your connection and try again."); });
  return queues[id];
}
function ingest(docs){
  const months = {}; let settings = null;
  S.tomb = [];
  for (const [id,d] of docs){ if (id==="settings") settings=d; else if (id==="tombstones") S.tomb=(d&&d.ids)||[]; else if (d && d.month) months[d.month]=d; }
  S.months = months; S.settings = normalizeSettings(settings || S.settings || DEFAULT_SETTINGS, months);
  if (settings && needsMigration(settings)) persist("settings", S.settings);   // save the new shape once
  if (!settings && S.ready===false && S.mode==="db") {/* first run for a new viewer */}
  S.ready = true; render();
}
function localLoad(){

}
async function boot(){
  const c = window.claude && window.claude.use ? window.claude : null;
  if (!c){ await bootWeb(); return; }
  const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
  const id = user ? await user.id() : null;
  if (!db || !id){ S.mode="local"; localLoad(); return; }
  col = db.collection("data/users/"+id);
  col.onSnapshot(snap => ingest(snap.docs.filter(d=>d.exists).map(d=>[d.id, clone(d.data())])),
    () => { S.mode="local"; localLoad(); });
}

const catGroup = (k, name) => { const c = budgetFor(k).find(c=>c.name===name); if (c) return c.group; for (const v of S.settings.versions.slice().reverse()){ const x=v.categories.find(c=>c.name===name); if (x) return x.group; } };
const catColor = g => g==="want" ? "var(--want)" : g==="need" ? "var(--need)" : g==="bill" ? "var(--bill)" : "var(--muted)";
function monthStats(k){
  const tx = monthTx(k); let spending = 0, bills = 0;
  for (const t of tx){ if (t.ignored) continue; if (catGroup(k,t.cat)==="bill") bills += t.amount; else spending += t.amount; }

}

/* ---------- Netlify API (outside claude.ai) ---------- */
const API = {
  pass: () => { try { return localStorage.getItem("wb-pass")||""; } catch(e){ return ""; } },
  async call(path, opts={}){
    const r = await fetch("/api/"+path, {...opts, headers:{"content-type":"application/json","x-app-passcode":API.pass()}});
    const j = await r.json().catch(()=>({}));
    if (r.status===401){ S.locked=true; render(); throw {code:"unauthorized"}; }
    if (!r.ok) throw {code:j.code||r.status, message:j.error||"Request failed"};
    return j;
  }
};
async function bootWeb(){
  try {
    const r = await fetch("/api/data", {headers:{"x-app-passcode":API.pass()}});
    const isJson = (r.headers.get("content-type")||"").includes("json");
    if (isJson && r.status===401){ S.mode="api"; S.locked=true; render(); return; }
    if (isJson && r.ok){ S.mode="api"; S.locked=false; const j=await r.json(); ingest(Object.entries(j.docs||{})); loadItems(true); return; }
    if (isJson){ const j=await r.json().catch(()=>({})); S.mode="api"; S.locked=true; S.lockMsg=j.error; render(); return; }
  } catch(e){}
  S.mode="local"; localLoad();
}
async function apiReload(){ const j = await API.call("data"); ingest(Object.entries(j.docs||{})); }

/* ---------- linked accounts (Plaid) ---------- */
const P = { items:[], loaded:false, busy:false, error:null };
const ago = isoTs => { if (!isoTs) return "not yet"; const m = Math.round((Date.now()-Date.parse(isoTs))/60000); return m<1?"just now":m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} hr ago`:`${Math.round(m/1440)} days ago`; };
async function loadItems(autoSync){
  if (S.mode!=="api") return;
  try { P.items = (await API.call("plaid/items")).items || []; P.loaded = true; P.error=null; } catch(e){ P.error = e.message||null; }
  if (V.tab==="profile") render();
  if (autoSync && P.items.length){
    const newest = Math.max(0, ...P.items.map(i=>Date.parse(i.lastSync||0)||0));
    if (Date.now()-newest > 15*60000) syncNow(true);
  }
}
async function syncNow(quiet){
  if (P.busy) return; P.busy = true; if (V.tab==="profile") render();
  try {
    const r = await API.call("plaid/sync", {method:"POST"});
    P.items = r.items || P.items; await apiReload();
    const n = (r.added||0)+(r.modified||0);
    if (!quiet || n) toast(n ? [r.added?`${r.added} new purchase${r.added===1?"":"s"}`:"", r.modified?`${r.modified} updated`:""].filter(Boolean).join(", ")+" from your accounts" : "Everything's up to date");
  } catch(e){ if (!quiet) toast(e.message || "Sync didn't finish. Try again in a minute."); }
  P.busy = false; render();
}
function loadPlaidScript(){
  return new Promise((res, rej) => {
    if (window.Plaid) return res();
    const s = document.createElement("script"); s.src = "https://cdn.plaid.com/link/v2/stable/link-initialize.js";
    s.onload = res; s.onerror = () => rej(new Error("Plaid couldn't load. Check your connection.")); document.head.appendChild(s);
  });
}
async function connectBank(itemId){
  try {
    await loadPlaidScript();
    const { link_token } = await API.call("plaid/link-token", {method:"POST", body: JSON.stringify(itemId?{item_id:itemId}:{})});
    const handler = window.Plaid.create({ token: link_token,
      onSuccess: async (public_token, meta) => {
        if (itemId){ toast("Reconnected"); syncNow(); return; }
        P.busy = true; render();
        try { const r = await API.call("plaid/exchange", {method:"POST", body: JSON.stringify({public_token, institution: meta?.institution?.name})});
          P.items = r.items || P.items; await apiReload(); toast(`${meta?.institution?.name||"Account"} linked. ${r.added||0} purchases pulled in.`); }
        catch(e){ toast(e.message || "Linking didn't finish. Try again."); }
        P.busy = false; render();
      },
      onExit: (err) => { if (err) toast(err.display_message || "Linking was cancelled."); } });
    handler.open();
  } catch(e){ toast(e.message || "Couldn't start linking. Try again."); }
}
let removeArmed = null;
async function profileAction(act, item){
  if (act==="connect") return connectBank();
  if (act==="reconnect") return connectBank(item);
  if (act==="sync") return syncNow();
  if (act==="remove"){
    if (removeArmed!==item){ removeArmed=item; render(); return; }
    removeArmed=null; try { await API.call("plaid/items/"+encodeURIComponent(item), {method:"DELETE"}); P.items = P.items.filter(i=>i.item_id!==item); toast("Account unlinked. Its purchases stay in your budget."); } catch(e){ toast(e.message||"Couldn't unlink. Try again."); }
    render(); return;
  }
  if (act==="export") return exportBackup();
  if (act==="import"){ $("#importIn").click(); return; }
  if (act==="lock"){ try { localStorage.removeItem("wb-pass"); } catch(e){} S.locked=true; render(); return; }
}

const fmtStart = () => "Sep 1, 2026";
async function exportBackup(){
  const docs = { settings: S.settings, tombstones: {ids:S.tomb} };
  for (const k in S.months) docs["m-"+k] = S.months[k];
  const text = JSON.stringify({app:"weekly-budget", exported:new Date().toISOString(), docs}, null, 1);
  const filename = `weekly-budget-backup-${iso(today())}.json`;
  const c = window.claude && window.claude.use ? window.claude : null;
  if (c){ const dl = await c.use("downloads"); if (dl){ try { await dl.save({filename, data:text}); } catch(e){ if (e.code!=="declined") toast("That download didn't start. Try again."); } return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type:"application/json"})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
document.addEventListener("change", async e => {
  if (e.target.id!=="importIn") return;
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const docs = j.docs || {};
    const ids = Object.keys(docs).filter(id=>/^(settings|tombstones|m-\d{4}-\d{2})$/.test(id));
    if (!ids.includes("settings")) throw new Error("That file isn't a Weekly Budget backup.");
    for (const id of ids) await persist(id, docs[id]);
    const merged = {}; merged.settings=S.settings; merged.tombstones={ids:S.tomb}; for (const k in S.months) merged["m-"+k]=S.months[k];
    for (const id of ids) merged[id]=docs[id];
    ingest(Object.entries(merged)); toast(`Restored ${ids.length} item${ids.length===1?"":"s"} from the backup`);
  } catch(err){ toast(err.message || "Couldn't read that file."); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible" && S.mode==="api" && !S.locked){ apiReload().then(()=>loadItems(true)).catch(()=>{}); } });

/* ---------- settings ---------- */
let draft = null, setMonth = null;
function openSettings(){
  setMonth = V.tab==="week" ? mkeyOf(V.week) : V.tab==="month" ? V.month : mkeyOf(today());
  const c = cfgFor(setMonth); draft = {categories: clone(c.categories).map(x=>({...x,_o:x.name})), base: clone({categories:c.categories})};
  drawSettings(); $("#setDlg").showModal();
}
function drawSettings(){
  const tot = g => draft.categories.filter(c=>!g||c.group===g).reduce((a,c)=>a+(+c.limit||0),0);
  const G = [["need","Needs","Add a need"],["want","Wants","Add a want"],["bill","Bills","Add a bill"]];
  const row = (c,i) => `<div class="srow"><input class="inp" data-c="${i}" data-f="name" value="${esc(c.name)}" aria-label="Name"><select class="inp" data-c="${i}" data-f="group" aria-label="Need, want or bill"><option value="need" ${c.group==="need"?"selected":""}>Need</option><option value="want" ${c.group==="want"?"selected":""}>Want</option><option value="bill" ${c.group==="bill"?"selected":""}>Bill</option></select><input class="inp" data-c="${i}" data-f="limit" inputmode="decimal" value="${c.limit}" aria-label="Monthly amount"><button type="button" class="icon" data-crm="${i}" aria-label="Remove ${esc(c.name)}">${icon.x}</button></div>`;
  $("#setBody").innerHTML = `<h3>Budget for ${monthName(setMonth)}<button type="button" class="icon" data-sclose aria-label="Close">${icon.x}</button></h3>
  <p class="note" style="margin-top:-8px">Changes start in ${monthName(setMonth)} and carry forward to every month after. Earlier months stay as they are.${nextChange(setMonth)?" If you changed the same item separately in a later month, that later change is kept from then on.":""}</p>
  <div class="sub" style="margin-top:14px">Monthly budget <span>${money(tot())}</span></div>
  ${G.map(([g,label,add])=>`<div class="sgrp"><div class="sgh"><span><i class="sw" style="background:${catColor(g)}"></i>${label}</span><span>${money(tot(g))}</span></div>
    ${draft.categories.map((c,i)=>c.group===g?row(c,i):"").join("")}
    <button type="button" class="add" data-cadd="${g}">${add}</button></div>`).join("")}
  <div class="actions"><button type="button" class="btn sec" data-sclose>Cancel</button><button type="button" class="btn pri" data-ssave>Save changes</button></div>`;
}
function refreshTotals(){
  const tot = g => draft.categories.filter(c=>!g||c.group===g).reduce((a,c)=>a+(+c.limit||0),0);
  const subs = document.querySelectorAll("#setBody .sgh span:last-child"); ["need","want","bill"].forEach((g,i)=>{ if (subs[i]) subs[i].textContent = money(tot(g)); });
  const all = document.querySelector("#setBody .sub span"); if (all) all.textContent = money(tot());
}
$("#setDlg").addEventListener("input", e => {
  const el = e.target; const f = el.dataset.f; if (!f) return;
  if (el.dataset.c!==undefined){ draft.categories[+el.dataset.c][f] = f==="limit" ? (parseFloat(el.value)||0) : el.value; if (f==="group") drawSettings(); else if (f==="limit") refreshTotals(); }
});
$("#setDlg").addEventListener("click", e => {
  const dlg=$("#setDlg"); const t=e.target;
  if (t===dlg || t.closest("[data-sclose]")){ dlg.close(); return; }
  const g = s => t.closest(s);
  if (g("[data-crm]")){ draft.categories.splice(+g("[data-crm]").dataset.crm,1); drawSettings(); }
  else if (g("[data-cadd]")){ const grp=g("[data-cadd]").dataset.cadd||"need"; draft.categories.push({name:grp==="bill"?"New bill":grp==="want"?"New want":"New need",group:grp,limit:0}); drawSettings(); const ins=document.querySelectorAll(`#setBody [data-f="name"]`); const last=ins[ins.length-1]; if (last){ last.focus(); last.select(); } }
  else if (g("[data-ssave]")){
    const cats = draft.categories.filter(c=>c.name.trim()).map(c=>({...c,name:c.name.trim(),limit:round2(+c.limit||0)}));
    const st = clone(S.settings);
    /* Carry each change forward into later months, unless that month changed the same item on its own */
    const carry = (baseList, newList, laterList, fields) => {
      let out = clone(laterList);
      for (const b of baseList){
        const n = newList.find(x=>x._o===b.name); const i = out.findIndex(x=>x.name===b.name);
        if (!n){ if (i>=0 && fields.every(f=>out[i][f]===b[f])) out.splice(i,1); continue; }
        if (i<0) continue;
        for (const f of fields) if (n[f]!==b[f] && out[i][f]===b[f]) out[i][f]=n[f];
        if (n.name!==b.name && !out.some(x=>x.name===n.name)) out[i].name=n.name;
      }
      for (const n of newList) if (!n._o && !out.some(x=>x.name===n.name)){ const {_o, ...rest}=n; out.push(rest); }
      return out.map(({_o, ...rest})=>rest);
    };
    const strip = l => l.map(({_o, ...rest})=>rest);
    st.versions = st.versions.map(v => v.from>setMonth ? {...v, categories: carry(draft.base.categories, cats, v.categories, ["group","limit"])} : v);
    st.versions = st.versions.filter(v=>v.from!==setMonth).concat([{from:setMonth, categories:strip(cats)}]).sort((a,b)=>a.from<b.from?-1:1);
    const sig = v => JSON.stringify(v.categories);
    st.versions = st.versions.filter((v,i,arr)=> i===0 || sig(v)!==sig(arr[i-1]));
    S.settings = st; persist("settings", st);
    dlg.close(); toast(`Saved for ${monthName(setMonth)} onward`); render();
  }
});

/* ---------- number boxes: the first keystroke replaces what's there ---------- */
const isNumBox = el => el && el.matches && el.matches('input[inputmode="decimal"]');
document.addEventListener("focusin", e => { const el = e.target; if (isNumBox(el)) el.dataset.fresh = "1"; });
document.addEventListener("focusout", e => { if (isNumBox(e.target)) delete e.target.dataset.fresh; });
document.addEventListener("beforeinput", e => {
  const el = e.target; if (!isNumBox(el) || el.dataset.fresh!=="1") return;
  delete el.dataset.fresh;
  if (!e.inputType || !e.inputType.startsWith("insert")) return;   // backspace etc. behave normally
  const text = e.data ?? (e.dataTransfer && e.dataTransfer.getData("text/plain")) ?? "";
  e.preventDefault();
  el.value = text; el.setSelectionRange(text.length, text.length);
  el.dispatchEvent(new Event("input", {bubbles:true}));
}, true);

let tt; function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2400); }

boot().catch(() => { S.mode="local"; localLoad(); });
setTimeout(()=>{ if(!S.ready){ S.mode="local"; localLoad(); } }, 12000);
})();
